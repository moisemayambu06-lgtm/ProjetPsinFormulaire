<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Formulaire Akatsuki</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
    }

    form {
      background-color: #1c1c1c;
      padding: 20px;
      margin: 20px auto;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 0 15px red;
    }

    h1 { color: red; }

    img {
      width: 250px;
      margin: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px red;
    }

    input, select, textarea, button {
      width: 100%;
      margin: 5px 0 15px 0;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    button {
      background-color: red;
      color: white;
      cursor: pointer;
    }

    #merci { display: none; color: lightgreen; }
    #score { margin-top: 10px; font-weight: bold; }
  </style>

</head>
<body>

  <h1>Recrutement Akatsuki</h1>
  <p>Remplis ce formulaire pour tester si tu peux rejoindre l'organisation.</p>

  <img src="https://media.tenor.com/mILvGFHFSjsAAAAC/akatsuki.gif">
  <img src="https://media1.tenor.com/m/zIZ-3gWNN_cAAAAC/naruto-anime.gif">

  <form id="formulaire">

    <label>Pseudo :</label>
    <input type="text" id="pseudo" required>

    <p>Objectif :</p>
    <input type="radio" name="objectif" value="paix"> Paix<br>
    <input type="radio" name="objectif" value="puissance"> Puissance<br>
    <input type="radio" name="objectif" value="argent"> Argent<br>

    <p>Capacités :</p>
    <input type="checkbox" value="ninjutsu"> Ninjutsu<br>
    <input type="checkbox" value="genjutsu"> Genjutsu<br>
    <input type="checkbox" value="taijutsu"> Taijutsu<br>

    <label>Membre préféré :</label>
    <select id="membre">
      <option>Itachi</option>
      <option>Pain</option>
      <option>Deidara</option>
      <option>Kisame</option>
    </select>

    <label>Pourquoi veux-tu rejoindre l'Akatsuki ?</label>
    <textarea id="commentaire"></textarea>

    <label>Quel est ton rêve ultime ?</label>
    <textarea id="reve"></textarea>

    <button type="submit">Envoyer</button>

  </form>

  <p id="merci">Merci ! Tes réponses ont été enregistrées ✅</p>
  <p id="score"></p>

  <script>
    document.getElementById("formulaire").addEventListener("submit", function(e) {
      e.preventDefault();

      let score = 0;

      let objectif = document.querySelector('input[name="objectif"]:checked');
      if (objectif) {
        if (objectif.value === "puissance") score += 2;
        if (objectif.value === "paix") score += 1;
      }

      let capacites = document.querySelectorAll('input[type="checkbox"]:checked');
      score += capacites.length;

      let commentaire = document.getElementById("commentaire").value;
      if (commentaire.length > 20) score += 1;

      let resultat = "";
      if (score >= 4) {
        resultat = "🔥 Accepté dans l'Akatsuki !";
      } else {
        resultat = "❌ Refusé... encore trop faible.";
      }

      document.getElementById("score").textContent = "Score : " + score + " → " + resultat;
      document.getElementById("merci").style.display = "block";

      // CSV
      let pseudo = document.getElementById("pseudo").value;
      let membre = document.getElementById("membre").value;
      let reve = document.getElementById("reve").value;

      let caps = [];
      capacites.forEach(cb => caps.push(cb.value));

      let csv = "Pseudo,Score,Resultat\n";
      csv += `${pseudo},${score},${resultat}`;

      let blob = new Blob([csv], { type: "text/csv" });
      let url = URL.createObjectURL(blob);

      let a = document.createElement("a");
      a.href = url;
      a.download = "resultat_akatsuki.csv";
      a.click();
    });
  </script>

</body>
</html>
